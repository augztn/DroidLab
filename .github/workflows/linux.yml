name: Linux build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GUI and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk xz-utils wget file gir1.2-gtk-4.0 gir1.2-gtk-3.0 python3-gi
      - name: Install Python packaging tools
        run: python -m pip install --upgrade pyinstaller "tkinterdnd2>=0.4.3,<1"
      - name: Compile-check Python
        run: python3 -m compileall -q src tests
      - name: Run tests
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v
      - name: Smoke-test frozen GUI bundle
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name droidlab-gui --distpath /tmp/pyinstaller-dist --workpath /tmp/pyinstaller-build --specpath /tmp --paths src --hidden-import=payload_dumper --hidden-import=tkinter.ttk --collect-all tkinterdnd2 src/app.py
          test -x /tmp/pyinstaller-dist/droidlab-gui

  # Build and smoke-test the AppImage on PRs too, and make non-release test builds downloadable.
  appimage:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xz-utils wget file libfuse2 xvfb gir1.2-gtk-4.0 gir1.2-gtk-3.0 python3-gi
          python -m pip install --upgrade pyinstaller "tkinterdnd2>=0.4.3,<1"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo install /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          VERSION="$VERSION" bash scripts/build-linux.sh
      - name: Smoke-test AppImage startup
        run: |
          appimage="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          rm -f "$HOME/DroidLab/logs/droidlab.log" /tmp/appimage-smoke.log
          set +e
          PYTHONFAULTHANDLER=1 APPIMAGE_EXTRACT_AND_RUN=1 timeout 8s xvfb-run -a "$appimage" > /tmp/appimage-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/appimage-smoke.log
          # On startup failure, print the application's own rotating log so
          # frozen-runtime exceptions are visible in Actions instead of only
          # showing PyInstaller's generic "unhandled exception" message.
          if [[ "$status" -ne 124 ]]; then
            echo "AppImage did not stay running (exit code $status)" >&2
            if [[ -f "$HOME/DroidLab/logs/droidlab.log" ]]; then
              echo "----- DroidLab application log -----" >&2
              cat "$HOME/DroidLab/logs/droidlab.log" >&2
            else
              echo "DroidLab log file was not created at $HOME/DroidLab/logs/droidlab.log" >&2
            fi
            exit 1
          fi
      - name: Upload downloadable AppImage test build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: droidlab-appimage-ci
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - name: Generate checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd dist && sha256sum *.AppImage > SHA256SUMS
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/SHA256SUMS
