name: Linux build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GUI and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk xz-utils wget file
      - name: Install Python packaging tools
        run: python -m pip install --upgrade pyinstaller
      - name: Compile-check Python
        run: python3 -m compileall -q src tests
      - name: Run tests
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v
      - name: Smoke-test frozen GUI bundle
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name payload-dumper-gui --distpath /tmp/pyinstaller-dist --workpath /tmp/pyinstaller-build --specpath /tmp --paths src --hidden-import=payload_dumper --hidden-import=tkinter.ttk src/app.py
          test -x /tmp/pyinstaller-dist/payload-dumper-gui
  appimage:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xz-utils wget file libfuse2 xvfb
          python -m pip install --upgrade pyinstaller
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo install /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          VERSION="$VERSION" bash scripts/build-linux.sh
      - name: Smoke-test AppImage startup
        run: |
          appimage="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 8s xvfb-run -a "$appimage" > /tmp/appimage-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/appimage-smoke.log
          # 124 means the GUI stayed running until the smoke-test timeout.
          if [[ "$status" -ne 124 ]]; then
            echo "AppImage did not stay running (exit code $status)" >&2
            exit 1
          fi
      - name: Generate checksum
        run: cd dist && sha256sum *.AppImage > SHA256SUMS
      - name: Upload downloadable AppImage artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: payload-dumper-appimage-ci
          path: |
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/SHA256SUMS
