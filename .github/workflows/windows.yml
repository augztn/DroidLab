name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            arch: x64
            runner: windows-2022
            python_arch: x64
            backend_arch: amd64
          # 32-bit Windows is omitted: upstream payload-dumper-go has no 386 release,
          # and its dependency tree does not compile for GOARCH=386.
          - label: ARM64
            arch: arm64
            runner: windows-11-arm
            python_arch: arm64
            backend_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "tkinterdnd2>=0.4.3,<1"
      - name: Compile-check Python
        run: python -m compileall -q src tests
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      # Build a complete portable ZIP for pull requests, pushes, manual runs, and releases.
      - name: Build portable Windows executable and backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.Substring(1) } else { "0.1.0-ci.$env:GITHUB_RUN_NUMBER" }
          $bundle = "dist\DroidLab-$version-windows-${{ matrix.arch }}"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DroidLab --distpath "$PWD\build\pyinstaller-dist" --workpath "$PWD\build\pyinstaller-work" --specpath "$PWD\build" --paths src --hidden-import=payload_dumper --hidden-import=tkinter.ttk --collect-all tkinterdnd2 src/app.py
          New-Item -ItemType Directory -Force -Path "$bundle\bin" | Out-Null
          Copy-Item "build\pyinstaller-dist\DroidLab.exe" "$bundle\DroidLab.exe"
          $backendVersion = "2.1.0"
          $archive = "payload-dumper-go_$($backendVersion)_windows_${{ matrix.backend_arch }}.tar.gz"
          $expectedBackendHash = if ("${{ matrix.backend_arch }}" -eq "amd64") { "45483c54bdd9219b8dcdb757256e7ce7a2bf9552d0e43f32e03389a1f0c55b15" } else { "254b4844c6e57b7205957832003920fba14d2336e69e8405416f4ad3978cfc35" }
          $url = "https://github.com/ssut/payload-dumper-go/releases/download/$backendVersion/$archive"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\payload-backend.tar.gz"
          $actualBackendHash = (Get-FileHash "$env:RUNNER_TEMP\payload-backend.tar.gz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualBackendHash -ne $expectedBackendHash) { throw "payload-dumper-go SHA-256 mismatch for $archive" }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\payload-backend" | Out-Null
          tar -xzf "$env:RUNNER_TEMP\payload-backend.tar.gz" -C "$env:RUNNER_TEMP\payload-backend"
          $backend = Get-ChildItem "$env:RUNNER_TEMP\payload-backend" -Recurse -File | Where-Object { $_.Name -eq "payload-dumper-go.exe" -or $_.Name -eq "payload-dumper-go" } | Select-Object -First 1
          if (-not $backend) { throw "payload-dumper-go executable not found in Windows release archive for ${{ matrix.arch }}" }
          Copy-Item $backend.FullName "$bundle\bin\payload-dumper-go.exe"
          $platformToolsZip = "$env:RUNNER_TEMP\platform-tools.zip"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools_r37.0.1-win.zip" -OutFile $platformToolsZip
          $platformToolsHash = (Get-FileHash $platformToolsZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($platformToolsHash -ne "45f4d63113e895ebde0c90f194099a4676b6ac653bd28d54314a9e022bbc1a99") { throw "Android platform-tools SHA-256 mismatch" }
          Expand-Archive -Path $platformToolsZip -DestinationPath "$env:RUNNER_TEMP\android-tools" -Force
          $toolsDir = Join-Path "$env:RUNNER_TEMP\android-tools" "platform-tools"
          if ((Test-Path "$toolsDir\adb.exe") -and (Test-Path "$toolsDir\fastboot.exe")) {
            Copy-Item "$toolsDir\adb.exe" "$bundle\bin\adb.exe"
            Copy-Item "$toolsDir\fastboot.exe" "$bundle\bin\fastboot.exe"
            if (Test-Path "$toolsDir\AdbWinApi.dll") { Copy-Item "$toolsDir\AdbWinApi.dll" "$bundle\bin\AdbWinApi.dll" }
            if (Test-Path "$toolsDir\AdbWinUsbApi.dll") { Copy-Item "$toolsDir\AdbWinUsbApi.dll" "$bundle\bin\AdbWinUsbApi.dll" }
          } else {
            Write-Warning "Google platform-tools binaries were not found; this architecture's bundle will use platform-tools from PATH."
          }
          @"
          DroidLab for Windows (${{ matrix.arch }})
          ==================================
          Run DroidLab.exe to start the application.

          The matching payload-dumper-go backend is bundled in the bin folder.
          ADB and Fastboot are bundled when compatible platform-tools binaries are available; otherwise install matching Android SDK Platform-Tools and add adb.exe and fastboot.exe to PATH.
          "@ | Set-Content "$bundle\README-Windows.txt"
          Compress-Archive -Path $bundle -DestinationPath "${bundle}.zip" -Force

      - name: Upload portable Windows ZIP for testing
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droidlab-windows-${{ matrix.arch }}
          path: dist/DroidLab-*-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Share Windows ZIP to Telegram
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_BOT_TOKEN) -or [string]::IsNullOrWhiteSpace($env:TELEGRAM_CHAT_ID)) {
            Write-Host "Telegram secrets are not configured; skipping Telegram delivery."
            exit 0
          }
          $zip = Get-ChildItem "dist\DroidLab-*-windows-${{ matrix.arch }}.zip" | Select-Object -First 1
          if (-not $zip) { throw "Windows ZIP not found for Telegram upload." }
          $caption = "DroidLab for Windows (${{ matrix.arch }})`nRelease: $env:GITHUB_REF_NAME"
          if ($zip.Length -gt 50MB) {
            $message = "$caption`nZIP exceeds Telegram Bot API's 50 MB limit. Download it here: $env:GITHUB_RELEASE_URL"
            & curl.exe --fail-with-body --silent --show-error -X POST "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" -F "chat_id=$env:TELEGRAM_CHAT_ID" --form-string "text=$message"
            if ($LASTEXITCODE -ne 0) { throw "Telegram notification failed." }
            Write-Host "ZIP exceeds 50 MB; sent Telegram message with download link instead."
          } else {
            & curl.exe --fail-with-body --silent --show-error -X POST "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendDocument" -F "chat_id=$env:TELEGRAM_CHAT_ID" -F "caption=$caption" -F "document=@$($zip.FullName)"
            if ($LASTEXITCODE -ne 0) { throw "Telegram ZIP upload failed." }
            Write-Host "Windows ZIP uploaded to Telegram."
          }

      # The cross-platform workflow publishes the unified release bundle.
