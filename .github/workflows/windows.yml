name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            arch: x64
            runner: windows-2022
            python_arch: x64
            backend_arch: amd64
          # 32-bit Windows is omitted: upstream payload-dumper-go has no 386 release,
          # and its dependency tree does not compile for GOARCH=386.
          - label: ARM64
            arch: arm64
            runner: windows-11-arm
            python_arch: arm64
            backend_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "tkinterdnd2>=0.4.3,<1"
      - name: Compile-check Python
        run: python -m compileall -q src tests
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Build portable Windows executable and backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.Substring(1) } else { "0.1.0-ci.$env:GITHUB_RUN_NUMBER" }
          $bundle = "dist\DroidLab-$version-windows-${{ matrix.arch }}"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DroidLab --add-data "$PWD\resources\safety-db;safety-db" --distpath "$PWD\build\pyinstaller-dist" --workpath "$PWD\build\pyinstaller-work" --specpath "$PWD\build" --paths src --hidden-import=payload_dumper --hidden-import=tkinter.ttk --collect-all tkinterdnd2 src/app.py
          New-Item -ItemType Directory -Force -Path "$bundle\bin" | Out-Null
          Copy-Item "build\pyinstaller-dist\DroidLab.exe" "$bundle\DroidLab.exe"
          $backendVersion = "2.1.0"
          $archive = "payload-dumper-go_$($backendVersion)_windows_${{ matrix.backend_arch }}.tar.gz"
          $url = "https://github.com/ssut/payload-dumper-go/releases/download/$backendVersion/$archive"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\payload-backend.tar.gz"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\payload-backend" | Out-Null
          tar -xzf "$env:RUNNER_TEMP\payload-backend.tar.gz" -C "$env:RUNNER_TEMP\payload-backend"
          $backend = Get-ChildItem "$env:RUNNER_TEMP\payload-backend" -Recurse -File | Where-Object { $_.Name -eq "payload-dumper-go.exe" -or $_.Name -eq "payload-dumper-go" } | Select-Object -First 1
          if (-not $backend) { throw "payload-dumper-go executable not found in Windows release archive for ${{ matrix.arch }}" }
          Copy-Item $backend.FullName "$bundle\bin\payload-dumper-go.exe"
          # Bundle Google's Windows platform-tools where the OS architecture supports them.
          # ARM64 Windows can run the official x64 tools under emulation; 32-bit Windows support
          # depends on the architecture of the upstream platform-tools package.
          $platformToolsZip = "$env:RUNNER_TEMP\platform-tools.zip"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $platformToolsZip
          Expand-Archive -Path $platformToolsZip -DestinationPath "$env:RUNNER_TEMP\android-tools" -Force
          $toolsDir = Join-Path "$env:RUNNER_TEMP\android-tools" "platform-tools"
          if ((Test-Path "$toolsDir\adb.exe") -and (Test-Path "$toolsDir\fastboot.exe")) {
            Copy-Item "$toolsDir\adb.exe" "$bundle\bin\adb.exe"
            Copy-Item "$toolsDir\fastboot.exe" "$bundle\bin\fastboot.exe"
            if (Test-Path "$toolsDir\AdbWinApi.dll") { Copy-Item "$toolsDir\AdbWinApi.dll" "$bundle\bin\AdbWinApi.dll" }
            if (Test-Path "$toolsDir\AdbWinUsbApi.dll") { Copy-Item "$toolsDir\AdbWinUsbApi.dll" "$bundle\bin\AdbWinUsbApi.dll" }
          } else {
            Write-Warning "Google platform-tools binaries were not found; this architecture's bundle will use platform-tools from PATH."
          }
          @"
          DroidLab for Windows (${{ matrix.arch }})
          ==================================
          Run DroidLab.exe to start the application.

          The matching payload-dumper-go backend is bundled in the bin folder.
          ADB and Fastboot are bundled when compatible platform-tools binaries are available; otherwise install matching Android SDK Platform-Tools and add adb.exe and fastboot.exe to PATH.
          "@ | Set-Content "$bundle\README-Windows.txt"
          Compress-Archive -Path $bundle -DestinationPath "$bundle.zip" -Force
      - name: Upload portable Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: droidlab-windows-${{ matrix.arch }}
          path: dist/DroidLab-*-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish Windows release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DroidLab-*-windows-${{ matrix.arch }}.zip
